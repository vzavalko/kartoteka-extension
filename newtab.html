<!doctype html>
<meta charset="utf-8">
<title>ZAKLADKA</title>
<script src="theme.js"></script>
<style>
:root{
  --ink:#0F0F0F; --paper:#fff; --surf:#F5F5F5; --muted:rgba(15,15,15,.42);
  --line:rgba(15,15,15,.10); --accent:#FA0CF7;
  color-scheme:light;
}
/* Тёмная — сине-серая, как в самой ZAKLADKA (в духе ночной темы Telegram).
   Включается не системой, а выбором на странице: его приносит theme.js. */
/* Фон — ровно фон страницы (#0E1621), чтобы пока фрейм грузится, не мигало. */
:root[data-theme="dark"]{
  --ink:#E6ECF2; --paper:#0E1621; --surf:#1F2B38; --muted:#7A8DA1;
  --line:rgba(140,172,204,.12);
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;
}
[hidden]{display:none!important}
#panel{
  min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:40px 20px;
}
.mark{width:52px;height:52px;border-radius:16px;background:var(--accent);display:grid;place-items:center}
.mark svg{width:29px;height:29px;color:#fff}
h1{margin:4px 0 0;font-size:22px;font-weight:700;letter-spacing:-.02em}
p{margin:0;font-size:13.5px;color:var(--muted);text-align:center;max-width:42ch}
.row{display:flex;gap:9px;margin-top:6px;flex-wrap:wrap;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.btn{
  display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 18px;border-radius:999px;
  border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:500;
  transition:background .13s,border-color .13s,filter .13s;
}
.btn:hover{background:var(--surf)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-primary:hover{filter:brightness(1.1);background:var(--accent)}
.btn svg{width:15px;height:15px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
/* ZAKLADKA во весь экран. Во фрейме, а не переходом: адрес вкладки остаётся
   chrome://newtab, и Chrome, как у своей новой вкладки, держит адресную
   строку пустой и с курсором. */
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--paper)}
kbd{font:11px ui-monospace,Menlo,monospace;background:var(--surf);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
</style>

<iframe id="app" hidden title="ZAKLADKA"></iframe>

<div id="panel" hidden>
  <span class="mark"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M1.9 12.6V3.4h4.2l1.4 1.9h6.6v7.3a.8.8 0 0 1-.8.8H2.7a.8.8 0 0 1-.8-.8Z"/></svg></span>
  <h1>ZAKLADKA</h1>
  <p id="sub">Автопереход выключен — новая вкладка остаётся здесь.</p>
  <div class="row">
    <button class="btn btn-primary" id="open">Открыть ZAKLADKA</button>
    <button class="btn" id="stash">Сдать все вкладки окна</button>
  </div>
  <div class="note">Включить автопереход можно в настройках расширения (значок → <kbd>⚙</kbd>).</div>
</div>

<script src="common.js"></script>
<script src="newtab.js"></script>
